services:
  # -------------------------------------------------------------
  # VerseMeet Frontend - Static Site Deployment on Render
  # Live URL: https://versemeet-1.onrender.com
  # -------------------------------------------------------------
  - type: web
    name: versemeet-1
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA Fallback Rewrite: Serves index.html for all subroutes
      # Prevents 404 Not Found on browser refresh or direct navigation
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate

  # -------------------------------------------------------------
  # VerseMeet Backend - Node.js WebRTC & Signaling API Server
  # Live URL: https://versemeet.onrender.com
  # -------------------------------------------------------------
  - type: web
    name: versemeet
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://versemeet-1.onrender.com
      - key: BACKEND_URL
        value: https://versemeet.onrender.com
